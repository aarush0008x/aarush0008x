<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="rockinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="50%" stop-color="#181818" />
      <stop offset="100%" stop-color="#281419" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#802938" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="1200" height="675" rx="16" fill="url(#rockinBg)" stroke="#802938" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Browser Header Bar -->
  <rect width="1200" height="50" rx="16" fill="#1C1C1C" />
  <circle cx="30" cy="25" r="6" fill="#EF4444" />
  <circle cx="50" cy="25" r="6" fill="#F59E0B" />
  <circle cx="70" cy="25" r="6" fill="#10B981" />
  
  <!-- Address bar -->
  <rect x="250" y="10" width="700" height="30" rx="8" fill="#121212" stroke="#F7F6F4" stroke-opacity="0.1" />
  <text x="600" y="30" fill="#9E9A93" font-family="monospace" font-size="13" text-anchor="middle">🔒 https://rockinroll.in — Modern Audio &amp; Entertainment Platform</text>

  <!-- Navigation / Brand -->
  <g transform="translate(60, 80)">
    <text x="0" y="35" fill="#F7F6F4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">🎵 RockinRoll<tspan fill="#E11D48">.in</tspan></text>
    <text x="0" y="65" fill="#9E9A93" font-family="sans-serif" font-size="15">Full-Stack Modern Audio Experience &amp; Real-Time Reactive Visuals</text>
  </g>

  <!-- Waveform / Spectrum Analyzer Display -->
  <g transform="translate(60, 180)">
    <rect width="1080" height="280" rx="16" fill="#161616" stroke="#F7F6F4" stroke-opacity="0.08" />
    
    <!-- Spectrum Bars -->
    <g transform="translate(40, 40)">
      <!-- 24 Bars with varied heights -->
      <rect x="0" y="120" width="28" height="80" rx="6" fill="url(#barGrad)" opacity="0.6" />
      <rect x="40" y="80" width="28" height="120" rx="6" fill="url(#barGrad)" opacity="0.8" />
      <rect x="80" y="40" width="28" height="160" rx="6" fill="url(#barGrad)" />
      <rect x="120" y="20" width="28" height="180" rx="6" fill="url(#barGrad)" />
      <rect x="160" y="60" width="28" height="140" rx="6" fill="url(#barGrad)" />
      <rect x="200" y="100" width="28" height="100" rx="6" fill="url(#barGrad)" />
      <rect x="240" y="30" width="28" height="170" rx="6" fill="url(#barGrad)" />
      <rect x="280" y="10" width="28" height="190" rx="6" fill="url(#barGrad)" />
      <rect x="320" y="50" width="28" height="150" rx="6" fill="url(#barGrad)" />
      <rect x="360" y="90" width="28" height="110" rx="6" fill="url(#barGrad)" />
      <rect x="400" y="30" width="28" height="170" rx="6" fill="url(#barGrad)" />
      <rect x="440" y="0" width="28" height="200" rx="6" fill="url(#barGrad)" />
      <rect x="480" y="20" width="28" height="180" rx="6" fill="url(#barGrad)" />
      <rect x="520" y="70" width="28" height="130" rx="6" fill="url(#barGrad)" />
      <rect x="560" y="110" width="28" height="90" rx="6" fill="url(#barGrad)" opacity="0.8" />
      <rect x="600" y="40" width="28" height="160" rx="6" fill="url(#barGrad)" />
      <rect x="640" y="10" width="28" height="190" rx="6" fill="url(#barGrad)" />
      <rect x="680" y="50" width="28" height="150" rx="6" fill="url(#barGrad)" />
      <rect x="720" y="90" width="28" height="110" rx="6" fill="url(#barGrad)" />
      <rect x="760" y="30" width="28" height="170" rx="6" fill="url(#barGrad)" />
      <rect x="800" y="60" width="28" height="140" rx="6" fill="url(#barGrad)" />
      <rect x="840" y="100" width="28" height="100" rx="6" fill="url(#barGrad)" />
      <rect x="880" y="130" width="28" height="70" rx="6" fill="url(#barGrad)" opacity="0.6" />
      <rect x="920" y="150" width="28" height="50" rx="6" fill="url(#barGrad)" opacity="0.4" />
    </g>

    <!-- Overlay Status Pill -->
    <g transform="translate(780, 20)">
      <rect width="260" height="36" rx="18" fill="#242424" stroke="#802938" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#10B981" />
      <text x="34" y="22" fill="#F7F6F4" font-family="monospace" font-size="12">Web Audio API · 60 FPS Visuals</text>
    </g>
  </g>

  <!-- Player Bottom Bar -->
  <g transform="translate(60, 490)">
    <rect width="1080" height="130" rx="16" fill="#1C1C1C" stroke="#F7F6F4" stroke-opacity="0.08" />
    
    <!-- Track Info -->
    <rect x="25" y="25" width="80" height="80" rx="10" fill="#802938" />
    <text x="65" y="72" fill="#F7F6F4" font-size="32" text-anchor="middle">🎧</text>
    <text x="125" y="55" fill="#F7F6F4" font-family="sans-serif" font-size="18" font-weight="700">Ultra Low-Latency Playback</text>
    <text x="125" y="82" fill="#9E9A93" font-family="monospace" font-size="13">High-Fidelity Web Audio Buffer · Zero Latency</text>

    <!-- Playback Controls -->
    <circle cx="540" cy="65" r="26" fill="#E11D48" />
    <polygon points="535,53 552,65 535,77" fill="#F7F6F4" />
    
    <!-- Progress Bar -->
    <rect x="650" y="55" width="380" height="8" rx="4" fill="#333333" />
    <rect x="650" y="55" width="240" height="8" rx="4" fill="#E11D48" />
    <circle cx="890" cy="59" r="6" fill="#F7F6F4" />
    <text x="1040" y="63" fill="#9E9A93" font-family="monospace" font-size="12">3:42</text>
  </g>
</svg>
