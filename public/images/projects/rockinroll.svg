<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="60%" stop-color="#1F1A18" />
      <stop offset="100%" stop-color="#2D1A15" />
    </linearGradient>
    <linearGradient id="rollAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Browser Frame -->
  <rect width="1200" height="675" rx="16" fill="url(#foodBg)" stroke="#EA580C" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Browser Header -->
  <rect width="1200" height="50" rx="16" fill="#1C1C1C" />
  <circle cx="30" cy="25" r="6" fill="#EF4444" />
  <circle cx="50" cy="25" r="6" fill="#F59E0B" />
  <circle cx="70" cy="25" r="6" fill="#10B981" />
  <rect x="250" y="10" width="700" height="30" rx="8" fill="#121212" stroke="#F7F6F4" stroke-opacity="0.1" />
  <text x="600" y="30" fill="#9E9A93" font-family="monospace" font-size="13" text-anchor="middle">🔒 https://rockinroll.in — Gourmet Food Ordering &amp; Live Delivery Platform</text>

  <!-- Left: Food Ordering Storefront & 3D Roll Highlight -->
  <g transform="translate(50, 80)">
    <rect width="660" height="530" rx="14" fill="#181818" stroke="#F7F6F4" stroke-opacity="0.08" />
    
    <!-- Brand Header -->
    <g transform="translate(30, 30)">
      <text x="0" y="30" fill="#F7F6F4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800">🌯 RockinRoll<tspan fill="#EA580C">.in</tspan></text>
      <text x="0" y="55" fill="#9E9A93" font-family="sans-serif" font-size="13">Gourmet Roll Ordering · Three.js 3D Interactive Roll · Kitchen HQ @ CGC Mohali</text>
    </g>

    <!-- Menu Cards Grid -->
    <g transform="translate(30, 110)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="285" height="175" rx="12" fill="#242424" stroke="#EA580C" stroke-width="1" stroke-opacity="0.4" />
        <rect x="15" y="15" width="60" height="60" rx="8" fill="#EA580C" fill-opacity="0.2" />
        <text x="45" y="55" font-size="28" text-anchor="middle">🌯</text>
        <text x="90" y="40" fill="#F7F6F4" font-family="sans-serif" font-size="16" font-weight="700">Paneer Tikka Roll</text>
        <text x="90" y="62" fill="#EA580C" font-family="monospace" font-size="14" font-weight="700">₹149</text>
        <rect x="15" y="90" width="255" height="70" rx="8" fill="#1A1A1A" />
        <text x="25" y="115" fill="#D6D2CB" font-family="monospace" font-size="11">● 3D Customizer: Extra Mint Mayo</text>
        <text x="25" y="135" fill="#4ADE80" font-family="monospace" font-size="11">● Kitchen Prep Timer: 8 Mins</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(315, 0)">
        <rect width="285" height="175" rx="12" fill="#242424" stroke="#F7F6F4" stroke-opacity="0.08" />
        <rect x="15" y="15" width="60" height="60" rx="8" fill="#D97706" fill-opacity="0.2" />
        <text x="45" y="55" font-size="28" text-anchor="middle">🥙</text>
        <text x="90" y="40" fill="#F7F6F4" font-family="sans-serif" font-size="16" font-weight="700">Crispy Veg Roll</text>
        <text x="90" y="62" fill="#D97706" font-family="monospace" font-size="14" font-weight="700">₹129</text>
        <rect x="15" y="90" width="255" height="70" rx="8" fill="#1A1A1A" />
        <text x="25" y="115" fill="#D6D2CB" font-family="monospace" font-size="11">● Cashfree Payment: Verified</text>
        <text x="25" y="135" fill="#4ADE80" font-family="monospace" font-size="11">● Brevo Email Receipt: Sent</text>
      </g>
    </g>

    <!-- 6-Stage Fulfillment Pipeline Card -->
    <g transform="translate(30, 320)">
      <rect width="600" height="170" rx="12" fill="#141414" stroke="#F7F6F4" stroke-opacity="0.06" />
      <text x="20" y="32" fill="#EA580C" font-family="monospace" font-size="12" font-weight="700">6-STAGE LIVE FULFILLMENT PIPELINE</text>
      
      <g transform="translate(20, 55)" font-family="monospace" font-size="10">
        <rect width="90" height="36" rx="6" fill="#242424" />
        <text x="45" y="22" fill="#4ADE80" text-anchor="middle">CONFIRMED</text>

        <rect x="100" width="90" height="36" rx="6" fill="#EA580C" />
        <text x="145" y="22" fill="#F7F6F4" text-anchor="middle" font-weight="700">PREPARING</text>

        <rect x="200" width="80" height="36" rx="6" fill="#242424" />
        <text x="240" y="22" fill="#9E9A93" text-anchor="middle">READY</text>

        <rect x="290" width="130" height="36" rx="6" fill="#242424" />
        <text x="355" y="22" fill="#9E9A93" text-anchor="middle">OUT_FOR_DELIVERY</text>

        <rect x="430" width="100" height="36" rx="6" fill="#242424" />
        <text x="480" y="22" fill="#9E9A93" text-anchor="middle">DELIVERED</text>
      </g>

      <text x="20" y="130" fill="#9E9A93" font-family="sans-serif" font-size="12">Role-Based RBAC: Customer · Kitchen KDS Staff · Rider Fleet Navigation · Admin</text>
      <text x="20" y="150" fill="#D6D2CB" font-family="sans-serif" font-size="12">In Collaboration with Renuka (@Renuka-wq) · Open Daily 11:00 AM – 11:00 PM</text>
    </g>
  </g>

  <!-- Right: Tech Stack & System Architecture -->
  <g transform="translate(740, 80)">
    <rect width="410" height="530" rx="14" fill="#181818" stroke="#EA580C" stroke-width="1" />
    
    <g transform="translate(30, 35)">
      <text x="0" y="30" fill="#F7F6F4" font-family="sans-serif" font-size="22" font-weight="800">Production Tech Stack</text>
      <text x="0" y="55" fill="#9E9A93" font-family="monospace" font-size="12">Next.js 16 · Prisma ORM · Cashfree</text>

      <g transform="translate(0, 85)" font-family="monospace" font-size="12">
        <rect width="350" height="60" rx="8" fill="#242424" />
        <text x="16" y="25" fill="#EA580C" font-weight="700">🎨 3D INTERACTIVE ROLL</text>
        <text x="16" y="45" fill="#D6D2CB">Procedural Three.js Model &amp; Custom Lighting</text>

        <rect y="70" width="350" height="60" rx="8" fill="#242424" />
        <text x="16" y="95" fill="#EA580C" font-weight="700">💳 CASHFREE PAYMENTS &amp; COD</text>
        <text x="16" y="115" fill="#D6D2CB">Webhook-Verified Instant Order Confirmation</text>

        <rect y="140" width="350" height="60" rx="8" fill="#242424" />
        <text x="16" y="165" fill="#EA580C" font-weight="700">📧 BREVO TRANSACTIONAL EMAILS</text>
        <text x="16" y="185" fill="#D6D2CB">OTP Verification &amp; Real-Time Order Updates</text>

        <rect y="210" width="350" height="60" rx="8" fill="#242424" />
        <text x="16" y="235" fill="#EA580C" font-weight="700">📱 INSTALLABLE PWA</text>
        <text x="16" y="255" fill="#D6D2CB">Mobile-First UI &amp; Offline Fallback Support</text>
      </g>
    </g>
  </g>
</svg>
