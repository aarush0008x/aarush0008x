<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bodhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#1C1A1D" />
      <stop offset="100%" stop-color="#2D151D" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="1200" height="675" rx="16" fill="url(#bodhBg)" stroke="#802938" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Header Bar -->
  <rect width="1200" height="50" rx="16" fill="#1C1C1C" />
  <circle cx="30" cy="25" r="6" fill="#EF4444" />
  <circle cx="50" cy="25" r="6" fill="#F59E0B" />
  <circle cx="70" cy="25" r="6" fill="#10B981" />
  <rect x="250" y="10" width="700" height="30" rx="8" fill="#121212" stroke="#F7F6F4" stroke-opacity="0.1" />
  <text x="600" y="30" fill="#9E9A93" font-family="monospace" font-size="13" text-anchor="middle">🤖 BodhAI — Cross-Platform AI Terminal Companion &amp; Edge Inference Router</text>

  <!-- Left Column: Terminal CLI -->
  <g transform="translate(50, 80)">
    <rect width="530" height="530" rx="14" fill="#0E0E0E" stroke="#333333" />
    <text x="25" y="35" fill="#802938" font-family="monospace" font-size="14" font-weight="700">bodhai@terminal:~$ query --live</text>
    
    <g transform="translate(25, 65)" font-family="monospace" font-size="13" fill="#D6D2CB">
      <text y="20" fill="#9E9A93">&gt; Initializing BodhAI Multi-Surface Runtime...</text>
      <text y="50" fill="#4ADE80">✓ Cloudflare Workers AI Edge Router Connected (88ms)</text>
      <text y="80" fill="#4ADE80">✓ Local Ollama Fallback Engine Standby</text>
      <text y="110" fill="#D6D2CB">&gt; User: "Synthesize latest research on Agentic Workflows"</text>
      <text y="145" fill="#F7F6F4" font-weight="700">[BodhAI Edge Llama 3.1 8B Response]:</text>
      <text y="175" fill="#E8E5E0">"Agentic AI workflows transition LLMs from static</text>
      <text y="200" fill="#E8E5E0">generation to iterative loops: Planning, Tool</text>
      <text y="225" fill="#E8E5E0">Execution, Feedback Evaluation, and Refinement."</text>
      <text y="265" fill="#802938">✓ Live Web Search Synthesis: 4 Sources Verified</text>
      <text y="295" fill="#802938">✓ Instant Worldwide Share URL Generated: /share/3x91a</text>
    </g>

    <!-- Edge Latency Badge -->
    <g transform="translate(25, 440)">
      <rect width="480" height="60" rx="10" fill="#1C1C1C" stroke="#802938" stroke-width="1" />
      <text x="20" y="36" fill="#F7F6F4" font-family="monospace" font-size="14" font-weight="700">Latency: 88ms (Edge) · Memory: 47MB Single Binary</text>
    </g>
  </g>

  <!-- Right Column: Multi-Surface Routing Diagram -->
  <g transform="translate(620, 80)">
    <rect width="530" height="530" rx="14" fill="#181818" stroke="#F7F6F4" stroke-opacity="0.1" />
    
    <g transform="translate(35, 35)">
      <text x="0" y="30" fill="#F7F6F4" font-family="sans-serif" font-size="24" font-weight="800">Multi-Surface Architecture</text>
      <text x="0" y="55" fill="#9E9A93" font-family="sans-serif" font-size="14">Windows · macOS · Termux / Android · iOS PWA</text>

      <!-- Architecture Flow Blocks -->
      <g transform="translate(0, 90)">
        <!-- Block 1 -->
        <rect width="460" height="70" rx="10" fill="#242424" stroke="#802938" stroke-width="1" />
        <text x="20" y="32" fill="#802938" font-family="monospace" font-size="11" font-weight="700">01 / DISPATCH LAYER</text>
        <text x="20" y="52" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">Cross-Platform CLI &amp; PWA Client Request</text>

        <!-- Block 2 -->
        <rect y="85" width="460" height="70" rx="10" fill="#242424" stroke="#802938" stroke-width="1" />
        <text x="20" y="117" fill="#802938" font-family="monospace" font-size="11" font-weight="700">02 / EDGE ROUTER</text>
        <text x="20" y="137" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">Cloudflare Workers AI (Global Edge Inference &lt;150ms)</text>

        <!-- Block 3 -->
        <rect y="170" width="460" height="70" rx="10" fill="#242424" stroke="#802938" stroke-width="1" />
        <text x="20" y="202" fill="#802938" font-family="monospace" font-size="11" font-weight="700">03 / LOCAL FALLBACK</text>
        <text x="20" y="222" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">Local Ollama Engine (Offline Zero-Cloud Operation)</text>

        <!-- Block 4 -->
        <rect y="255" width="460" height="70" rx="10" fill="#242424" stroke="#802938" stroke-width="1" />
        <text x="20" y="287" fill="#802938" font-family="monospace" font-size="11" font-weight="700">04 / SYNTHESIS &amp; EXPORT</text>
        <text x="20" y="307" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">Live Search Web Synthesis &amp; Session Excel Export</text>
      </g>
    </g>
  </g>
</svg>
