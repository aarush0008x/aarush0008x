<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#242424" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="240" rx="16" fill="url(#cardGrad)" stroke="#F7F6F4" stroke-width="1" stroke-opacity="0.1" />

  <!-- Section Header -->
  <text x="40" y="45" fill="#F7F6F4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
    ⚡ Engineering Impact &amp; Activity
  </text>
  <text x="40" y="65" fill="#9E9A93" font-family="sans-serif" font-size="12">
    Verified metrics across production repositories, hackathons, and edge systems
  </text>

  <!-- Metric 1: Hackathons -->
  <g transform="translate(40, 95)">
    <rect width="220" height="110" rx="12" fill="#141414" stroke="#802938" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="32" fill="#9E9A93" font-family="monospace" font-size="11">HACKATHONS</text>
    <text x="20" y="70" fill="#F7F6F4" font-family="sans-serif" font-size="28" font-weight="800">2 Major</text>
    <text x="20" y="92" fill="#802938" font-family="sans-serif" font-size="12" font-weight="600">24-Hour National Sprints</text>
  </g>

  <!-- Metric 2: Live Deployments -->
  <g transform="translate(290, 95)">
    <rect width="220" height="110" rx="12" fill="#141414" stroke="#802938" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="32" fill="#9E9A93" font-family="monospace" font-size="11">ACTIVE REPOSITORIES</text>
    <text x="20" y="70" fill="#F7F6F4" font-family="sans-serif" font-size="28" font-weight="800">8+ Repos</text>
    <text x="20" y="92" fill="#4ADE80" font-family="sans-serif" font-size="12" font-weight="600">● Open Source &amp; Live</text>
  </g>

  <!-- Metric 3: Edge Inference -->
  <g transform="translate(540, 95)">
    <rect width="220" height="110" rx="12" fill="#141414" stroke="#802938" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="32" fill="#9E9A93" font-family="monospace" font-size="11">EDGE ARCHITECTURE</text>
    <text x="20" y="70" fill="#F7F6F4" font-family="sans-serif" font-size="28" font-weight="800">&lt;150ms</text>
    <text x="20" y="92" fill="#802938" font-family="sans-serif" font-size="12" font-weight="600">Cloudflare Workers AI</text>
  </g>
</svg>
