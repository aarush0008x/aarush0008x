<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="60%" stop-color="#242424" />
      <stop offset="100%" stop-color="#381B21" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#802938" />
      <stop offset="100%" stop-color="#B23B4E" />
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#802938" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#802938" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="20" fill="url(#bgGrad)" stroke="#802938" stroke-width="1.5" stroke-opacity="0.4" />
  <rect width="1200" height="240" rx="20" fill="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#F7F6F4" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="900" y1="0" x2="900" y2="240" />
    <line x1="1000" y1="0" x2="1000" y2="240" />
    <line x1="1100" y1="0" x2="1100" y2="240" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
  </g>

  <!-- Content -->
  <!-- Pill Badge -->
  <g transform="translate(60, 38)">
    <rect width="280" height="30" rx="15" fill="#1E1E1E" stroke="#802938" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#802938" />
    <text x="30" y="19" fill="#D6D2CB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">B.TECH AI &amp; DS · CGC UNIVERSITY</text>
  </g>

  <!-- Title -->
  <text x="60" y="125" fill="#F7F6F4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Aarush Singh<tspan fill="#802938">.</tspan>
  </text>

  <!-- Subtitle -->
  <text x="60" y="165" fill="#D6D2CB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
    Full-Stack Web &amp; Edge Systems Developer <tspan fill="#802938">·</tspan> 24-Hr Hackathon Competitor
  </text>

  <!-- Highlight Badges on Right -->
  <g transform="translate(780, 55)">
    <!-- Project 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="42" rx="10" fill="#1E1E1E" stroke="#F7F6F4" stroke-opacity="0.1" />
      <text x="16" y="26" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">⚡ nimoCode</text>
    </g>
    <!-- Project 2 -->
    <g transform="translate(185, 0)">
      <rect width="170" height="42" rx="10" fill="#1E1E1E" stroke="#F7F6F4" stroke-opacity="0.1" />
      <text x="16" y="26" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">🎵 RockinRoll</text>
    </g>
    <!-- Project 3 -->
    <g transform="translate(0, 52)">
      <rect width="170" height="42" rx="10" fill="#1E1E1E" stroke="#F7F6F4" stroke-opacity="0.1" />
      <text x="16" y="26" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">🛡️ EvidenceLedger</text>
    </g>
    <!-- Project 4 -->
    <g transform="translate(185, 52)">
      <rect width="170" height="42" rx="10" fill="#1E1E1E" stroke="#F7F6F4" stroke-opacity="0.1" />
      <text x="16" y="26" fill="#F7F6F4" font-family="sans-serif" font-size="14" font-weight="600">🤖 BodhAI</text>
    </g>
    <!-- Status Indicator -->
    <g transform="translate(0, 106)">
      <rect width="355" height="28" rx="8" fill="#802938" fill-opacity="0.2" stroke="#802938" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="14" r="3.5" fill="#4ADE80" />
      <text x="28" y="18" fill="#F7F6F4" font-family="sans-serif" font-size="11" font-weight="600">OPEN FOR COLLABORATIONS &amp; SPRINT INQUIRIES</text>
